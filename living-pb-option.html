<meta charset="UTF-8">

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Pretendard,sans-serif;font-size:13px;line-height:1.5}
.top-bar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top-bar .logo{font-weight:700;font-size:15px}
.top-bar .v-badge{background:var(--accent);color:#fff;padding:2px 7px;border-radius:10px;font-size:10px;margin-left:4px}
.top-bar .meta{color:var(--text2);font-size:11px;margin-left:auto}
.top-bar button{background:#f1f2f6;border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:12px}
.top-bar button:hover{background:#e8e9ef}
.container{max-width:1600px;margin:0 auto;padding:20px 24px}
.landing-hero{background:linear-gradient(135deg,#6c5ce7 0%,#8b5cf6 100%);color:#fff;border-radius:14px;padding:28px;margin-bottom:20px}
.landing-hero h1{font-size:22px;margin-bottom:6px}
.landing-hero .s{opacity:.9;font-size:13px}
.landing-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.landing-stats .stat{background:rgba(255,255,255,.15);border-radius:8px;padding:10px 14px}
.landing-stats .stat .l{font-size:10px;opacity:.8}
.landing-stats .stat .v{font-size:18px;font-weight:700}
@media(max-width:700px){.landing-stats{grid-template-columns:repeat(2,1fr)}}
.grid{display:grid;gap:14px}
.grid-cards{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.p-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all .15s;text-decoration:none;color:inherit;display:block}
.p-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 14px rgba(108,92,231,.08)}
.p-card .cat{font-size:10px;color:var(--text2);margin-bottom:4px}
.p-card .title{font-size:14px;font-weight:700;margin-bottom:4px;line-height:1.3}
.p-card .pid{font-size:10px;color:var(--text3);font-family:monospace}
.p-card .metric-row{display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.p-card .metric{flex:1}
.p-card .metric .l{font-size:10px;color:var(--text2)}
.p-card .metric .v{font-size:14px;font-weight:700;color:var(--self)}
.p-card .vs{margin-top:8px;font-size:11px;color:var(--text2);display:flex;justify-content:space-between}
.p-card .vs .win{color:var(--green);font-weight:600}
.p-card .vs .loss{color:var(--red);font-weight:600}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px}
.card h3{font-size:13px;font-weight:600;margin-bottom:10px}
.card .sub{font-size:11px;color:var(--text2);margin-bottom:8px}
.kpi-card{border-left:4px solid var(--self)}
.kpi-card.compA{border-left-color:var(--compA)}
.kpi-card.compB{border-left-color:var(--compB)}
.kpi-card.compC{border-left-color:var(--compC)}
.kpi-title{font-size:11px;color:var(--text2);font-weight:600;margin-bottom:4px}
.kpi-label{font-size:12px;font-weight:600;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kpi-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--border)}
.kpi-row:last-child{border-bottom:0}
.kpi-row .l{font-size:11px;color:var(--text2)}
.kpi-row .v{font-size:14px;font-weight:700}
.kpi-row .s{font-size:10px;color:var(--text3);margin-left:4px}
.chart-box{position:relative;height:260px}
.chart-box.lg{height:320px}
.chart-box.xl{height:380px}
.tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:56px;z-index:90}
.tab-btn{background:none;border:0;padding:12px 14px;cursor:pointer;font-size:13px;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab-content{display:none}
.tab-content.active{display:block}
.btn-group{display:inline-flex;background:#f1f2f6;border-radius:6px;padding:2px;margin-left:6px}
.btn-group button{background:none;border:0;padding:4px 9px;cursor:pointer;font-size:11px;color:var(--text2);border-radius:4px;font-family:inherit}
.btn-group button.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.controls{display:flex;align-items:center;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.controls .label{font-size:11px;color:var(--text2)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:left}
th{background:#f9fafb;font-weight:600;color:var(--text2);font-size:11px}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.self{color:var(--self);font-weight:700}
td.compA{color:var(--compA)}
td.compB{color:var(--compB)}
td.compC{color:var(--compC)}
.opt-name{font-size:11px;color:var(--text2);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main-tag{background:rgba(59,130,246,.15);color:var(--self);font-size:9px;padding:1px 5px;border-radius:3px;margin-left:3px;font-weight:600}

.p-header .name{flex:1;min-width:0}
.p-header .name .t{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:3px}
.p-header .name .s{font-size:11px;color:var(--text2)}

function fmt(v, kind){
  if(v==null||isNaN(v)) return '-';
  if(kind==='krw') return Math.round(v).toLocaleString()+'원';
  if(kind==='krw_m') return (v/10000).toFixed(1)+'만';
  if(kind==='pct') return v.toFixed(2)+'%';
  if(kind==='pp') return (v>=0?'+':'')+v.toFixed(2)+'%p';
  if(kind==='ratio') return v.toFixed(2)+'%';
  if(kind==='int') return Math.round(v).toLocaleString();
  return v;
}

    if(e.target.tagName!=='BUTTON') return;
    chips.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    renderCards();
  };
  document.getElementById('search-input').oninput = renderCards;
  document.querySelector('.filter-bar .chip-group:last-child').onclick = e=>{
    if(e.target.tagName!=='BUTTON') return;
    e.target.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    renderCards();
  };
  renderCards();
}

function renderCards(){
  const grid = document.getElementById('landing-grid');
  const search = document.getElementById('search-input').value.toLowerCase();
  const cate = document.querySelector('#cate-chips .active').dataset.cate;
  const sort = document.querySelector('.filter-bar .chip-group:last-child .active').dataset.sort;
  let lst = DATA.landing.filter(f=>{
    if(cate!=='all' && f.cate_d2!==cate) return false;
    if(search && !((f.name||'').toLowerCase().includes(search) || (f.cate_leaf||'').toLowerCase().includes(search))) return false;
    return true;
  });
  if(sort==='gmv') lst.sort((a,b)=>b.gmv_30-a.gmv_30);
  if(sort==='cvr') lst.sort((a,b)=>b.cvr-a.cvr);
  if(sort==='opt') lst.sort((a,b)=>b.opt_count-a.opt_count);

  grid.innerHTML = lst.map(f=>{
    const win = f.gmv_30 > f.comp_gmv_total / Math.max(1, DATA.families[f.key].comps.length);
    const winLabel = win?'<span class="win">▲ 평균보다 위</span>':'<span class="loss">▼ 평균보다 아래</span>';
    return `
    <a class="p-card" href="#fam/${f.key}">
      <div class="cat">${f.cate_d2} · ${f.cate_leaf}</div>
      <div class="title">${f.name}</div>
      <div class="pid">PID ${f.main_pid}${f.pb_pids.length>1?` (+${f.pb_pids.length-1}서브)`:''} · 옵션 ${f.opt_count}개 · 경쟁 ${f.comps_n}개</div>
      <div class="metric-row">
        <div class="metric"><div class="l">30일 GMV</div><div class="v">${(f.gmv_30/10000).toFixed(0)}만</div></div>
        <div class="metric"><div class="l">CTR</div><div class="v">${f.ctr.toFixed(2)}%</div></div>
        <div class="metric"><div class="l">CVR</div><div class="v">${f.cvr.toFixed(2)}%</div></div>
        <div class="metric"><div class="l">CPC</div><div class="v">${f.cpc?Math.round(f.cpc).toLocaleString():'-'}</div></div>
      </div>
      <div class="vs"><span>경쟁사 합계 GMV: ${(f.comp_gmv_total/10000).toFixed(0)}만</span>${winLabel}</div>
    </a>
  `;}).join('');
  if(!lst.length) grid.innerHTML = '<div class="card">표시할 상품군이 없습니다.</div>';
}

function renderDashboard(key){
  const fam = DATA.families[key];
  if(!fam){location.hash=''; return;}
  destroyCharts();
  document.getElementById('landing-view').classList.remove('show');
  document.getElementById('dashboard-view').classList.add('show');
  document.getElementById('back-btn').style.display='inline-flex';
  document.getElementById('meta-info').textContent = '상품군 '+key+' · PB '+fam.pb_pids.length+'개 vs 경쟁 '+fam.comps.length+'개';

  const tabs = document.getElementById('dash-tabs');
  tabs.innerHTML = `
    <button class="tab-btn active" data-tab="ov">📊 종합 비교</button>
    <button class="tab-btn" data-tab="opt">🧩 옵션별 거래액</button>
    <button class="tab-btn" data-tab="funnel">🚀 퍼널 & CTR/CVR</button>
    <button class="tab-btn" data-tab="ad">📢 광고 분석</button>
    <button class="tab-btn" data-tab="diag">⚠️ 진단 카드</button>
  `;
  tabs.onclick = e=>{
    if(e.target.tagName!=='BUTTON') return;
    tabs.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    document.querySelector('.tab-content[data-tab="'+e.target.dataset.tab+'"]').classList.add('active');
  };

  const c = document.getElementById('dash-container');
  c.innerHTML = renderDashHTML(fam);
  setTimeout(()=>renderDashCharts(fam), 50);
}

function renderDashCharts(fam){
  const dates = DATA.dates;
  const s = fam.self, comps = fam.comps;
  const all = [s].concat(comps);

  function ds(p, valKey, opts={}){
    return {
      label: p.role==='self'?'🔵 자사 PB':'⚔️ '+p.label+' ('+p.pid+')',
      data: p.daily.map(d=>d[valKey]),
      borderColor: COLORS[p.role],
      backgroundColor: COLORS[p.role]+'33',
      borderWidth: p.role==='self'?3:2,
      borderDash: p.role==='self'?[]:[5,5],
      fill: opts.fill||false,
      tension:0.25,
      pointRadius:1.5,
      ...opts
    };
  }
  function dsAd(p, valKey, opts={}){
    return {
      label: p.role==='self'?'🔵 자사 PB':'⚔️ '+p.label+' ('+p.pid+')',
      data: p.ads.map(d=>d[valKey]),
      borderColor: COLORS[p.role],
      backgroundColor: COLORS[p.role]+'33',
      borderWidth: p.role==='self'?3:2,
      borderDash: p.role==='self'?[]:[5,5],
      fill:false, tension:0.25, pointRadius:1.5, ...opts
    };
  }

  // 종합 - GMV
  CHARTS.push(new Chart(document.getElementById('ch-gmv'), {
    type:'line',
    data:{labels:dates, datasets: all.map(p=>ds(p,'gmv'))},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{font:{size:11}}}, tooltip:{callbacks:{label:c=>c.dataset.label+': '+(c.parsed.y/10000).toFixed(1)+'만'}}},
      scales:{y:{beginAtZero:true, ticks:{callback:v=>(v/10000).toFixed(0)+'만'}}}
    }
  }));
  // 종합 - imp
  CHARTS.push(new Chart(document.getElementById('ch-imp'),{
    type:'line', data:{labels:dates, datasets: all.map(p=>ds(p,'imp'))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}}, scales:{y:{beginAtZero:true}}}
  }));
  // 종합 - PDP + 구매 (자사만, two-axis)
  CHARTS.push(new Chart(document.getElementById('ch-pdpbuy'),{
    type:'line', data:{labels:dates,
      datasets:[
        {label:'PDP뷰 (자사)', data:s.daily.map(d=>d.pdp), borderColor:COLORS.self, backgroundColor:COLORS.self+'33', borderWidth:2, fill:true, tension:0.25, pointRadius:1, yAxisID:'y'},
        {label:'구매 (자사)', data:s.daily.map(d=>d.buy), borderColor:COLORS.compA, borderWidth:2, fill:false, tension:0.25, pointRadius:1, yAxisID:'y1'},
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},
      scales:{y:{type:'linear',position:'left',beginAtZero:true},y1:{type:'linear',position:'right',beginAtZero:true,grid:{drawOnChartArea:false}}}}
  }));

  // 옵션별 30일 GMV 가로막대
  const optLabels = fam.options.map((o,i)=>(i+1)+'. '+(o.name||'옵션'+o.oid).slice(0,28));
  CHARTS.push(new Chart(document.getElementById('ch-opt-bar'),{
    type:'bar',
    data:{labels:optLabels, datasets:[{label:'30일 GMV', data:fam.options.map(o=>o.gmv_30), backgroundColor:fam.options.map(o=>o.is_main?COLORS.self:'#94a3b8'), borderWidth:0}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>(c.parsed.x/10000).toFixed(1)+'만원'}}},
      scales:{x:{beginAtZero:true,ticks:{callback:v=>(v/10000).toFixed(0)+'만'}}}}
  }));
  // 일자별 옵션별 (stacked area)
  const PALETTE = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316','#a855f7','#14b8a6','#fbbf24'];
  function buildOptDS(mode){
    return fam.options.map((o,i)=>({
      label:(i+1)+'.'+(o.name||'옵').slice(0,18),
      data:o.daily, backgroundColor:PALETTE[i]+(mode==='stack'?'cc':'00'),
      borderColor:PALETTE[i], borderWidth: mode==='line'?2:1, fill: mode==='stack',
      tension:0.2, pointRadius:0,
    }));
  }
  let optDailyChart = new Chart(document.getElementById('ch-opt-daily'),{
    type:'line', data:{labels:dates, datasets: buildOptDS('stack')},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:9},boxWidth:8}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+(c.parsed.y/10000).toFixed(1)+'만'}}},
      scales:{y:{stacked:true,beginAtZero:true,ticks:{callback:v=>(v/10000).toFixed(0)+'만'}}}}
  });
  CHARTS.push(optDailyChart);
  document.querySelector('.tab-content[data-tab="opt"] .btn-group').onclick=e=>{
    if(e.target.tagName!=='BUTTON') return;
    e.target.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    const mode = e.target.dataset.mode;
    optDailyChart.data.datasets = buildOptDS(mode);
    optDailyChart.options.scales.y.stacked = (mode==='stack');
    optDailyChart.update();
  };

  // 퍼널 - CTR / CVR
  CHARTS.push(new Chart(document.getElementById('ch-ctr'),{
    type:'line', data:{labels:dates, datasets: all.map(p=>({
      label:p.role==='self'?'🔵 자사':p.label,
      data:p.daily.map(d=>d.imp?(d.pdp/d.imp*100):null),
      borderColor:COLORS[p.role], borderWidth: p.role==='self'?3:2, borderDash:p.role==='self'?[]:[5,5], fill:false, tension:0.25, pointRadius:1.5, spanGaps:true
    }))}, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>v.toFixed(1)+'%'}}}}
  }));
  CHARTS.push(new Chart(document.getElementById('ch-cvr'),{
    type:'line', data:{labels:dates, datasets: all.map(p=>({
      label:p.role==='self'?'🔵 자사':p.label,
      data:p.daily.map(d=>d.pdp?(d.buy/d.pdp*100):null),
      borderColor:COLORS[p.role], borderWidth: p.role==='self'?3:2, borderDash:p.role==='self'?[]:[5,5], fill:false, tension:0.25, pointRadius:1.5, spanGaps:true
    }))}, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>v.toFixed(1)+'%'}}}}
  }));
  // funnel bar - 노출/PDP/구매 30일 합계 (3 stages x N products)
  CHARTS.push(new Chart(document.getElementById('ch-funnel'),{
    type:'bar', data:{labels:['노출','PDP뷰','구매'], datasets: all.map(p=>({
      label: p.role==='self'?'🔵 자사':p.label,
      data: [p.kpi.imp, p.kpi.pdp, p.kpi.buy],
      backgroundColor: COLORS[p.role]+'cc', borderColor:COLORS[p.role], borderWidth:0
    }))}, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11}}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.y.toLocaleString()}}},
      scales:{y:{type:'logarithmic'}}}
  }));

  // 광고 - 광고비 + CPC dual axis
  CHARTS.push(new Chart(document.getElementById('ch-ad'),{
    data:{labels:dates, datasets:[
      ...all.map(p=>({type:'bar', label:(p.role==='self'?'🔵 ':'')+p.label.replace('자사 PB','자사')+' 광고비', data:p.ads.map(d=>d.ad_spend), backgroundColor:COLORS[p.role]+'cc', yAxisID:'y'})),
      ...all.map(p=>({type:'line', label:(p.role==='self'?'🔵 ':'')+p.label.replace('자사 PB','자사')+' CPC', data:p.ads.map(d=>d.ad_click?d.ad_spend/d.ad_click:null), borderColor:COLORS[p.role], borderWidth:2, fill:false, tension:0.25, pointRadius:1.5, yAxisID:'y1', spanGaps:true}))
    ]}, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:9},boxWidth:8}}},
      scales:{y:{type:'linear',position:'left',beginAtZero:true,ticks:{callback:v=>(v/1000).toFixed(0)+'k'}},y1:{type:'linear',position:'right',beginAtZero:true,grid:{drawOnChartArea:false},ticks:{callback:v=>v.toFixed(0)+'원'}}}}
  }));
  CHARTS.push(new Chart(document.getElementById('ch-adimp'),{
    type:'line', data:{labels:dates, datasets: all.map(p=>dsAd(p,'ad_imp'))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{y:{beginAtZero:true}}}
  }));
  CHARTS.push(new Chart(document.getElementById('ch-adclick'),{
    type:'line', data:{labels:dates, datasets: all.map(p=>dsAd(p,'ad_click'))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{y:{beginAtZero:true}}}
  }));
}

function route(){
  const h = location.hash;
  if(h.startsWith('#fam/')){
    const key = h.substring(5);
    renderDashboard(key);
  } else {
    renderLanding();
  }
  window.scrollTo(0,0);
}

document.getElementById('back-btn').onclick = ()=>location.hash='';
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
