<title>매출 추이 대시보드 · PB vs 경쟁</title>
<style>
:root{
  color-scheme: light dark;
  --plane:#f9f9f7; --surface:#fcfcfb; --surface2:#f4f3f0;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --pb:#2a78d6; --comp:#eb6834; --comp2:#eda100;
  --good:#006300; --bad:#d03b3b; --chip:#eef0ee;
}

    --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --pb:#3987e5; --comp:#d95926; --comp2:#c98500;
    --good:#0ca30c; --bad:#e66767; --chip:#242422;
  }
}
:root[data-theme="light"]{
  --plane:#f9f9f7; --surface:#fcfcfb; --surface2:#f4f3f0;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --pb:#2a78d6; --comp:#eb6834; --comp2:#eda100;
  --good:#006300; --bad:#d03b3b; --chip:#eef0ee;
}
:root[data-theme="dark"]{
  --plane:#0d0d0d; --surface:#1a1a19; --surface2:#242422;
  --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --pb:#3987e5; --comp:#d95926; --comp2:#c98500;
  --good:#0ca30c; --bad:#e66767; --chip:#242422;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3{margin:0;font-weight:650}
.wrap{max-width:1240px;margin:0 auto;padding:20px 20px 80px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin-bottom:12px}
header h1{font-size:20px}
.sub{color:var(--muted);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.tnum{font-variant-numeric:tabular-nums}

/* nav */
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.nav button{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink2);
  padding:8px 15px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px}
.nav button.on{background:var(--pb);border-color:var(--pb);color:#fff;font-weight:600}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 18px;
  padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.ctl-label{font-size:12px;color:var(--muted);margin-right:2px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink2);padding:6px 12px;
  font-size:13px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--pb);color:#fff;font-weight:600}
input[type=date]{font-family:inherit;font-size:12.5px;padding:5px 8px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);color-scheme:light dark}
select{font-family:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink)}
.range-note{font-size:12px;color:var(--muted)}

/* period total strip */
.totalbar{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:900px){.totalbar{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.totalbar{grid-template-columns:1fr}}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.tcard.lead{border-color:var(--pb)}
.tcard .tl{font-size:11px;color:var(--muted);letter-spacing:.03em}
.tcard .tv{font-size:24px;font-weight:720;letter-spacing:-.01em;margin-top:4px}
.tcard.lead .tv{color:var(--pb)}
.tcard .ts{font-size:12px;color:var(--ink2);margin-top:5px}
.tcard .ts .delta{font-size:12px}

/* KPI grid */
.kpigrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.kpigrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.kpigrid{grid-template-columns:1fr}}
.kpi{cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:var(--pb)}
.kpi .g{font-size:11px;color:var(--muted);letter-spacing:.03em}
.kpi .pair{font-size:12.5px;margin:2px 0 10px}
.kpi .pair b{font-weight:600}
.kpi .lbl{font-size:11px;color:var(--muted)}
.kpi .big{font-size:22px;font-weight:680;letter-spacing:-.01em}
.kpi .idxrow{display:flex;align-items:baseline;gap:8px;margin-top:3px}
.idx{font-size:12.5px;font-weight:650}
.delta{font-size:12px;font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}
.kpi .mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(46px,1fr));gap:6px 8px;margin-top:11px;
  border-top:1px solid var(--border);padding-top:9px}
.kpi .mini div{font-size:11px;color:var(--muted);text-align:center}
.kpi .mini b{display:block;color:var(--ink);font-size:12.5px;font-weight:600;margin-top:1px}

/* detail */
.detail-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}
.detail-head h2{font-size:17px}
.detail-head .vs{font-size:12.5px;color:var(--muted)}
.detail-head .vs b.pb{color:var(--pb)} .detail-head .vs b.cp{color:var(--comp)}
.detail-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
@media(max-width:920px){.detail-grid{grid-template-columns:1fr}}
.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.panel-title h3{font-size:14px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surface2);border-radius:10px;padding:11px 12px}
.tile .t{font-size:11px;color:var(--muted)}
.tile .v{font-size:17px;font-weight:660;margin-top:2px}
.tile .c{font-size:11.5px;color:var(--ink2);margin-top:2px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:11px}
tbody tr:hover{background:var(--surface2)}
.bar{height:5px;border-radius:3px;background:var(--pb);margin-top:3px}

.tt{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);
  padding:7px 9px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .08s;z-index:20;
  box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap}
.tt b{color:#fff}
.note{font-size:12px;color:var(--muted);background:var(--surface2);border:1px dashed var(--border);
  border-radius:10px;padding:12px 14px;margin-top:14px}
.warn{border-color:var(--comp);color:var(--ink2)}
.foot{margin-top:26px;color:var(--muted);font-size:11.5px}
svg{display:block;width:100%;height:auto;overflow:visible}
.chk{font-size:12px;color:var(--ink2);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.catov{margin-top:20px}
.catov h3{font-size:14px;margin:0 0 4px}
.catov .csub{font-size:12px;color:var(--muted);margin-bottom:12px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.catcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.cctitle{font-size:12.5px;font-weight:600;margin-bottom:2px}
.cctitle .amt{float:right;color:var(--ink2);font-weight:600}
.ccsub{font-size:11px;color:var(--muted);margin-bottom:6px}
.catsec{margin-top:18px;border-top:1px solid var(--border);padding-top:14px}
.funnel{margin-top:18px;border-top:1px solid var(--border);padding-top:14px}
.fbar{display:flex;height:20px;border-radius:5px;overflow:hidden;border:1px solid var(--border);background:var(--surface2)}
.fbar .seg{height:100%}
.frow{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:10px;margin:5px 0}
.frow .who{font-size:11.5px;color:var(--ink2);font-weight:600}
.fnote{font-size:11px;color:var(--muted);margin-top:8px}
.catshare{font-size:12px;color:var(--ink2)}
.catshare b{color:var(--ink);font-weight:650}
.promobar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:4px}
.pchip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);
  display:inline-flex;align-items:center;gap:5px}
.pchip .dot{width:8px;height:8px;border-radius:50%}
.pchip .pd{color:var(--muted)}

/* ---- 주간 비교 ---- */
.wkhead h2{font-size:17px;margin-bottom:3px}
.wksub{font-size:12.5px;color:var(--muted)}
.wkbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:14px 0 6px;
  padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px}
.wkbar .vs{color:var(--muted);font-size:12.5px}
.wkbar b{font-variant-numeric:tabular-nums}
.wkwrap{overflow-x:auto}
.wkbtn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink2);
  padding:5px 10px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px}
.wkbtn:hover{border-color:var(--pb);color:var(--pb)}
table.wk{width:100%;min-width:1180px;border-collapse:collapse;font-size:13px;margin-top:10px}
table.wk th{text-align:right;font-weight:600;color:var(--muted);font-size:11.5px;
  padding:0 10px 7px;border-bottom:1px solid var(--border);white-space:nowrap}
table.wk th.l,table.wk td.l{text-align:left}
table.wk td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;vertical-align:top}
table.wk tr.grp td{background:var(--surface2);font-weight:650;font-size:12px;color:var(--ink2);padding:6px 10px}
table.wk tr.pb td{background:color-mix(in srgb,var(--pb) 5%,transparent)}
table.wk td.who{max-width:250px;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10px;font-weight:700;color:#fff;border-radius:4px;padding:1px 5px;margin-right:6px}
.tag.pb{background:var(--pb)} .tag.cp{background:var(--comp)}
.wv{font-variant-numeric:tabular-nums;font-weight:650}
.wprev{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:400}
.warr{color:var(--muted);margin:0 4px;font-size:11px}
.wd{display:block;font-size:11px;font-variant-numeric:tabular-nums;margin-top:2px}
.wd.up{color:var(--good)} .wd.down{color:var(--bad)} .wd.flat{color:var(--muted)}
.wdi{font-variant-numeric:tabular-nums;font-size:11.5px}
.wdi.up{color:var(--good)} .wdi.down{color:var(--bad)} .wdi.flat{color:var(--muted)}
.wdrv{font-size:12px;text-align:left}
.wdrv .co{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}
.wsep{border-left:1px solid var(--border)}
table.wk tr.clk{cursor:pointer}
table.wk tr.clk:hover td{background:color-mix(in srgb,var(--pb) 9%,transparent)}
.exp{display:inline-block;width:12px;color:var(--muted);font-size:10px;margin-right:3px}
table.wk tr.open td{background:color-mix(in srgb,var(--pb) 12%,transparent)}
table.wk tr.opt td{padding:0;background:var(--surface2)}
.optwrap{padding:12px 16px 14px}
.optttl{font-size:12px;color:var(--ink2);font-weight:650;margin-bottom:8px}
.optttl span{font-weight:400;color:var(--muted)}
table.opt{width:100%;border-collapse:collapse;font-size:12.5px}
table.opt th{text-align:right;font-size:11px;color:var(--muted);font-weight:600;padding:0 8px 5px;white-space:nowrap}
table.opt th.l,table.opt td.l{text-align:left}
table.opt td{padding:5px 8px;text-align:right;white-space:nowrap;border-top:1px solid var(--border);
  font-variant-numeric:tabular-nums}
table.opt td.rk{color:var(--muted);width:26px}
table.opt td.onm{white-space:normal;word-break:break-all;max-width:340px;font-variant-numeric:normal}
.obar{height:4px;border-radius:3px;background:var(--pb);opacity:.65;margin-top:3px}
.optnote{font-size:11px;color:var(--muted);margin-top:8px}
.optempty{font-size:12px;color:var(--muted);padding:10px 2px}
</style>

<script>
const D = window.DASH;
const $ = s => document.querySelector(s);
const tip = $('#tooltip');

/* ---------- formatting ---------- */
const won = v => {
  v = Math.round(v||0);
  if (Math.abs(v) >= 1e8) return (v/1e8).toFixed(v>=1e9?0:1)+'억';
  if (Math.abs(v) >= 1e4) return Math.round(v/1e4).toLocaleString()+'만';
  return v.toLocaleString();
};
const wonUnit = v => Math.round(v||0).toLocaleString()+'원';   // AOV: 원 단위
const plain   = v => Math.round(v||0).toLocaleString();
const num = v => Math.round(v||0).toLocaleString();
const pct = v => (v==null||!isFinite(v)) ? '–' : (v*100).toFixed(2)+'%';
const idxPct = (a,b) => (!b) ? '–' : Math.round(a/b*100)+'%';

/* ---------- date utils ---------- */
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const iso = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const addDays=(dt,n)=>{const x=new Date(dt);x.setDate(x.getDate()+n);return x;};
const mondayOf=dt=>{const x=new Date(dt);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x;};
const DMIN=parse(D.dateRange.start), DMAX=parse(D.dateRange.end);

/* ---------- data access ---------- */
const dailyOf = pid => D.daily[pid] || [];
const nm = pid => D.names[pid] || {short:String(pid),full:String(pid)};
const compName = pid => nm(pid).short + ' (' + pid + ')';   // 경쟁 상품은 상품코드 병기

function sumRange(pid,start,end){
  let g=0,o=0,q=0,i=0,c=0;
  for(const r of dailyOf(pid)){
    if(r.dt>=start && r.dt<=end){g+=r.gmv;o+=r.orders;q+=r.qty;i+=r.imp;c+=r.clk;}
  }
  return {gmv:g,orders:o,qty:q,imp:i,clk:c,ctr:i?c/i:0,cvr:c?o/c:0,aov:o?g/o:0};
}
function sumRangeMulti(pids,start,end){
  const t={gmv:0,orders:0,qty:0,imp:0,clk:0};
  for(const p of pids){const s=sumRange(p,start,end);t.gmv+=s.gmv;t.orders+=s.orders;t.qty+=s.qty;t.imp+=s.imp;t.clk+=s.clk;}
  t.ctr=t.imp?t.clk/t.imp:0; t.cvr=t.clk?t.orders/t.clk:0; t.aov=t.orders?t.gmv/t.orders:0;
  return t;
}
function series(pids,start,end,gran){
  const map=new Map();
  const keyFn = gran==='day' ? (dt=>iso(dt))
    : gran==='week' ? (dt=>iso(mondayOf(dt)))
    : (dt=>iso(dt).slice(0,7));
  for(const p of pids){
    for(const r of dailyOf(p)){
      if(r.dt<start||r.dt>end) continue;
      const k=keyFn(parse(r.dt));
      let b=map.get(k); if(!b){b={key:k,gmv:0,orders:0,qty:0,imp:0,clk:0};map.set(k,b);}
      b.gmv+=r.gmv;b.orders+=r.orders;b.qty+=r.qty;b.imp+=r.imp;b.clk+=r.clk;
    }
  }
  const arr=[...map.values()].sort((a,b)=>a.key<b.key?-1:1);
  for(const b of arr){b.ctr=b.imp?b.clk/b.imp:0;b.cvr=b.clk?b.orders/b.clk:0;b.aov=b.orders?b.gmv/b.orders:0;
    b.label = gran==='week' ? b.key.slice(5).replace('-','/')+' 주'
            : gran==='month' ? b.key.slice(0,7)
            : b.key.slice(5).replace('-','/');}
  return arr;
}

/* ---------- state ---------- */
const RANGES = [
  {k:'w1',  label:'최근 1주',  days:7,   gran:'day'},
  {k:'w4',  label:'최근 4주',  days:28,  gran:'day'},
  {k:'w12', label:'최근 12주', days:84,  gran:'week'},
  {k:'mtd', label:'이번 달',   mtd:true, gran:'day'},
  {k:'all', label:'전체',      all:true, gran:'week'},
];
const METRICS = {
  gmv:{label:'매출',fmt:won,ffmt:v=>'₩'+Math.round(v).toLocaleString()},
  imp:{label:'임프레션',fmt:num,ffmt:num},
  ctr:{label:'CTR',fmt:pct,ffmt:pct},
  cvr:{label:'CVR',fmt:pct,ffmt:pct},
  aov:{label:'AOV',fmt:plain,ffmt:wonUnit},   // 원 단위
  orders:{label:'주문수',fmt:num,ffmt:num},
  idx:{label:'지수',fmt:v=>Math.round(v),ffmt:v=>Math.round(v)+' (시작=100)'},
};
const PROMO_COLORS = {'스오딜':'#e87ba4', '쿠폰':'#4a3aa7', '행사':'#1baf7a'};
function spanOf(key,gran){
  if(gran==='day') return [key,key];
  if(gran==='week'){ return [key, iso(addDays(parse(key),6))]; }
  return [key+'-01', key+'-31'];   // month bucket
}
// category daily GMV → bucketed series / period sum
function catSeries(cid,start,end,gran){
  const keyFn = gran==='day'?(dt=>iso(dt)):gran==='week'?(dt=>iso(mondayOf(dt))):(dt=>iso(dt).slice(0,7));
  const map=new Map();
  for(const r of (D.catDaily[cid]||[])){
    if(r.dt<start||r.dt>end) continue;
    const k=keyFn(parse(r.dt)); let b=map.get(k); if(!b){b={key:k,gmv:0};map.set(k,b);} b.gmv+=r.gmv;
  }
  const arr=[...map.values()].sort((a,b)=>a.key<b.key?-1:1);
  for(const b of arr) b.label = gran==='week'?b.key.slice(5).replace('-','/')+' 주':gran==='month'?b.key.slice(0,7):b.key.slice(5).replace('-','/');
  return arr;
}
function catSum(cid,start,end){ let g=0; for(const r of (D.catDaily[cid]||[])) if(r.dt>=start&&r.dt<=end) g+=r.gmv; return g; }
// funnel: sum impressions/clicks by surface bucket over the months overlapping [start,end]
function funnelAgg(pids,start,end){
  const m0=start.slice(0,7), m1=end.slice(0,7);
  const agg={}; (D.funnelBuckets||[]).forEach(b=>agg[b.k]={imp:0,clk:0});
  for(const p of pids){ for(const r of (D.funnel[String(p)]||[])){
    if(r.ym<m0||r.ym>m1) continue; if(!agg[r.b]) agg[r.b]={imp:0,clk:0};
    agg[r.b].imp+=r.imp; agg[r.b].clk+=r.clk; } }
  return agg;
}
const manNum = v => v>=1e4 ? (v/1e4).toFixed(1)+'만' : Math.round(v).toLocaleString();

let ST = { rangeKey:'w12', gran:'week', view:'summary', groupIdx:0, metric:'gmv', split:false,
           cStart:D.dateRange.start, cEnd:D.dateRange.end,
           wkIdx:null, wkBase:null, wkOpen:new Set() };   // 주간비교: 비교주/기준주 인덱스 + 펼친 상품

function rangeDates(){
  if(ST.rangeKey==='custom'){
    let a=ST.cStart, b=ST.cEnd; if(a>b){[a,b]=[b,a];}
    return [a<D.dateRange.start?D.dateRange.start:a, b>D.dateRange.end?D.dateRange.end:b];
  }
  const r=RANGES.find(x=>x.k===ST.rangeKey);
  if(r.all) return [D.dateRange.start, D.dateRange.end];
  if(r.mtd){ const s=new Date(DMAX.getFullYear(),DMAX.getMonth(),1); return [iso(s), D.dateRange.end]; }
  const s=addDays(DMAX, -(r.days-1)); const sc = s<DMIN?DMIN:s;
  return [iso(sc), D.dateRange.end];
}
function prevDates(start,end){
  const s=parse(start),e=parse(end); const len=Math.round((e-s)/86400000)+1;
  return [iso(addDays(s,-len)), iso(addDays(s,-1))];
}

/* ---------- SVG line chart ---------- */
const RIGHT_AXIS_COLOR = '#1baf7a';
function lineChart(el, lines, metric, bands){
  const rightLines = lines.filter(l=>l.axis==='right');
  const hasRight = rightLines.length>0;
  const leftLines = lines.filter(l=>l.axis!=='right');
  const W=680,H=280,PAD={l:58,r:hasRight?62:16,t:14,b:34};
  const iw=W-PAD.l-PAD.r, ih=H-PAD.t-PAD.b;
  const n = lines[0]?lines[0].pts.length:0;
  const half = n>1 ? iw/(n-1)/2 : iw/2;
  function scale(arr){
    let mx=Math.max(...arr,0), rmin=Math.min(...arr,0);
    let mn = rmin>=0 ? 0 : rmin;
    if(mx===mn) mx=mn+1;
    const p=(mx-mn)*0.08; mx+=p; if(mn<0) mn-=p;
    return {mn,mx};
  }
  const L = scale((leftLines.length?leftLines:lines).flatMap(l=>l.pts.map(p=>p.v)));
  const R = hasRight ? scale(rightLines.flatMap(l=>l.pts.map(p=>p.v))) : null;
  const X=i=> n<=1?PAD.l+iw/2 : PAD.l + iw*i/(n-1);
  const YL=v=> PAD.t + ih*(1-(v-L.mn)/(L.mx-L.mn));
  const YR=v=> PAD.t + ih*(1-(v-R.mn)/(R.mx-R.mn));
  const Yof=l=> l.axis==='right'?YR:YL;
  const lfmt = METRICS[metric].fmt;
  const lffmt = METRICS[metric].ffmt;
  const rffmt = v=>'₩'+Math.round(v||0).toLocaleString();
  const fmtOf=l=> l.axis==='right'?rffmt:lffmt;
  // promo overlay bands (behind grid/lines)
  let bandSvg='';
  for(const bd of (bands||[])){
    if(bd.point){
      const x=X(bd.i0);
      bandSvg+=`<line x1="${x}" x2="${x}" y1="${PAD.t}" y2="${PAD.t+ih}" stroke="${bd.color}" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>`;
      bandSvg+=`<circle cx="${x}" cy="${PAD.t}" r="3.5" fill="${bd.color}"/>`;
    }else{
      const x0=X(bd.i0)-half, x1=X(bd.i1)+half;
      bandSvg+=`<rect x="${x0.toFixed(1)}" y="${PAD.t}" width="${Math.max(2,x1-x0).toFixed(1)}" height="${ih}" fill="${bd.color}" opacity="0.13"/>`;
      bandSvg+=`<rect x="${x0.toFixed(1)}" y="${PAD.t}" width="2" height="${ih}" fill="${bd.color}" opacity="0.55"/>`;
    }
  }
  let grid='';
  for(let g=0;g<=4;g++){const y=PAD.t+ih*(1-g/4);
    grid+=`<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    grid+=`<text x="${PAD.l-8}" y="${y+3.5}" text-anchor="end" fill="var(--muted)" font-size="10.5" class="tnum">${lfmt(L.mn+(L.mx-L.mn)*g/4)}</text>`;
    if(hasRight) grid+=`<text x="${W-PAD.r+7}" y="${y+3.5}" text-anchor="start" fill="${RIGHT_AXIS_COLOR}" font-size="10.5" class="tnum">${won(R.mn+(R.mx-R.mn)*g/4)}</text>`;}
  const step=Math.ceil(n/8); let xlab='';
  for(let i=0;i<n;i++){ if(i%step && i!==n-1) continue;
    xlab+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle" fill="var(--muted)" font-size="10.5" class="tnum">${lines[0].pts[i].label}</text>`;}
  let paths='';
  for(const l of lines){
    const yf=Yof(l);
    const d=l.pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+yf(p.v).toFixed(1)).join(' ');
    paths+=`<path d="${d}" fill="none" stroke="${l.color}" stroke-width="2" ${l.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round"/>`;
    if(n<=1) paths+=`<circle cx="${X(0)}" cy="${yf(l.pts[0].v)}" r="4" fill="${l.color}"/>`;
  }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img">
    ${bandSvg}${grid}${xlab}${paths}
    <line id="cross" x1="0" x2="0" y1="${PAD.t}" y2="${PAD.t+ih}" stroke="var(--axis)" stroke-width="1" opacity="0"/>
    <g id="dots"></g>
    <rect id="hit" x="${PAD.l}" y="${PAD.t}" width="${iw}" height="${ih}" fill="transparent"/>
  </svg>`;
  const svgEl=el.querySelector('svg'), cross=el.querySelector('#cross'), dots=el.querySelector('#dots'), hit=el.querySelector('#hit');
  function move(ev){
    const r=svgEl.getBoundingClientRect();
    const sx=(ev.clientX-r.left)/r.width*W;
    let i=Math.round((sx-PAD.l)/(iw/Math.max(n-1,1)));
    i=Math.max(0,Math.min(n-1,i));
    cross.setAttribute('x1',X(i));cross.setAttribute('x2',X(i));cross.setAttribute('opacity','1');
    dots.innerHTML=lines.map(l=>`<circle cx="${X(i)}" cy="${Yof(l)(l.pts[i].v)}" r="4" fill="${l.color}" stroke="var(--surface)" stroke-width="2"/>`).join('');
    let html=`<div>${lines[0].pts[i].label}</div>`;
    for(const l of lines) html+=`<div><span style="color:${l.color}">●</span> ${l.name}: <b>${fmtOf(l)(l.pts[i].v)}</b></div>`;
    tip.innerHTML=html; tip.style.opacity=1;
    tip.style.left=Math.min(ev.clientX+14, window.innerWidth-tip.offsetWidth-10)+'px';
    tip.style.top=(ev.clientY-10)+'px';
  }
  hit.addEventListener('mousemove',move);
  hit.addEventListener('mouseleave',()=>{tip.style.opacity=0;cross.setAttribute('opacity','0');dots.innerHTML='';});
}

/* ---------- 주간 비교 (월~일 완결주, 직전주 vs 2주전) ---------- */
const cnt = v => { v=Math.round(v||0);
  return Math.abs(v)>=1e4 ? (v/1e4).toFixed(Math.abs(v)>=1e6?0:1)+'만' : v.toLocaleString(); };

// 데이터 구간에 완전히 들어오는 월~일 주만 (진행 중인 주 제외)
function completeWeeks(){
  const out=[]; let m=mondayOf(DMIN);
  if(iso(m)<D.dateRange.start) m=addDays(m,7);
  for(;;){ const s=iso(m), e=iso(addDays(m,6)); if(e>D.dateRange.end) break; out.push({s,e}); m=addDays(m,7); }
  return out;
}
const WEEKS = completeWeeks();
const wkLabel = w => `${w.s.slice(5).replace('-','/')}~${w.e.slice(5).replace('-','/')}`;
const relCh = (a,b) => (b && isFinite(a/b)) ? (a-b)/b : null;

function wkChip(a,b){
  const r=relCh(a,b);
  if(r==null) return '<span class="wd flat">–</span>';
  const cls = Math.abs(r)<0.005?'flat':(r>0?'up':'down');
  return `<span class="wd ${cls}">${r>0?'+':''}${(r*100).toFixed(1)}%</span>`;
}
// 두 주의 실적을 한 칸에: 기준주 → 비교주, 그 아래 증감률
// 표 안에서 한 줄로 쓰는 증감 배지 (wkChip은 블록이라 셀 아래로 떨어진다)
function wkChipInline(a,b){
  const r=relCh(a,b);
  if(r==null) return '<span class="wdi flat">–</span>';
  const cls = Math.abs(r)<0.005?'flat':(r>0?'up':'down');
  return `<span class="wdi ${cls}">${r>0?'+':''}${(r*100).toFixed(1)}%</span>`;
}
const wkCell = (c,p,fmt,sep) => `<td class="${sep?'wsep':''}">`+
  `<span class="wprev">${fmt(p)}</span><span class="warr">→</span><span class="wv">${fmt(c)}</span>${wkChip(c,p)}</td>`;

// 매출 = 임프 × CTR × CVR × 객단가 (정확한 항등식) → 로그분해로 변화 주도 요인 추출.
// 주도 요인 하나만 보이면 반대로 움직인 항목이 가려지므로, 상쇄 요인도 같이 돌려준다.
function wkDriver(c,p){
  if(!(c.gmv>0 && p.gmv>0)) return null;
  const f=(a,b)=>(a>0&&b>0)?Math.log(a/b):0;
  const parts=[{k:'임프레션',v:f(c.imp,p.imp),a:c.imp,b:p.imp},
               {k:'CTR',   v:f(c.ctr,p.ctr),a:c.ctr,b:p.ctr},
               {k:'CVR',   v:f(c.cvr,p.cvr),a:c.cvr,b:p.cvr},
               {k:'객단가', v:f(c.aov,p.aov),a:c.aov,b:p.aov}];
  parts.sort((x,y)=>Math.abs(y.v)-Math.abs(x.v));
  const top=parts[0];
  if(!top || Math.abs(top.v)<0.01) return null;
  const opp=parts.find(x=>x!==top && x.v!==0 && Math.sign(x.v)!==Math.sign(top.v) && Math.abs(x.v)>=0.05);
  return {top,opp};
}
const drvTxt = d => `${d.k} ${d.v>0?'▲':'▼'} ${Math.abs((d.a/d.b-1)*100).toFixed(1)}%`;

/* 주별 옵션 상위10 — 행을 펼쳤을 때 나오는 패널. wkOpts[pid][주월요일] = [[옵션명idx,gmv,qty,orders],...] */
const wkOptOf = (pid,wkStart) => (D.wkOpts && D.wkOpts[pid] && D.wkOpts[pid][wkStart]) || null;
const optName = i => (D.wkOptNames && D.wkOptNames[i]) || '(이름없음)';

function wkOptPanel(pid,cw,pw){
  if(!D.wkOpts) return `<div class="optempty">주별 옵션 데이터가 빌드에 포함되지 않았습니다.</div>`;
  const cur=wkOptOf(pid,cw.s), prv=wkOptOf(pid,pw.s);
  if(!cur || !cur.length) return `<div class="optempty">${wkLabel(cw)} 주에 판매된 옵션이 없습니다.</div>`;
  const prvQty=new Map((prv||[]).map(o=>[o[0],o[2]]));
  const max=Math.max(...cur.map(o=>o[1]));
  let missing=false;
  const rows=cur.map((o,i)=>{
    const [ni,gmv,qty,ord]=o;
    const pq=prvQty.has(ni)?prvQty.get(ni):null;
    if(pq==null) missing=true;
    const nm2=optName(ni);
    return `<tr>
      <td class="l rk">${i+1}</td>
      <td class="l onm" title="${nm2.replace(/"/g,'&quot;')}">${nm2}</td>
      <td>${pq==null?'<span style="color:var(--muted)">–</span>':num(pq)}</td>
      <td><span class="warr">→</span><b>${num(qty)}</b></td>
      <td>${pq==null?'<span class="wdi flat">신규/순위밖</span>':wkChipInline(qty,pq)}</td>
      <td>${num(ord)}</td>
      <td>₩${won(gmv)}<div class="obar" style="width:${Math.max(4,gmv/max*100)}%"></div></td>
    </tr>`;
  }).join('');
  return `<div class="optwrap">
    <div class="optttl">${wkLabel(cw)} 주 판매 상위 ${cur.length}개 옵션 <span>· 수량 기준 · ${wkLabel(pw)} 주와 비교</span></div>
    <table class="opt">
      <thead><tr><th class="l">#</th><th class="l">옵션</th>
        <th>${wkLabel(pw)} 수량</th><th>${wkLabel(cw)} 수량</th><th>증감</th><th>주문</th><th>매출</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="optnote">주마다 상위 10개만 저장하므로, ${missing?'‘신규/순위밖’은 기준주에 안 팔렸다는 뜻이 아니라 <b>그 주 상위 10위 안에 없었다</b>는 뜻입니다. ':''}옵션 매출은 df_com_sales(PAYMENT 기준)이라 위 표의 순매출과 총액이 다를 수 있습니다.</div>
  </div>`;
}

function renderWeekly(){
  const el=$('#viewWeekly');
  if(WEEKS.length<2){ el.innerHTML='<div class="card">완결된 주가 2개 미만이라 비교할 수 없습니다.</div>'; return; }
  // Number.isInteger로 검사할 것 — null>=0 은 JS에서 true라 비교 가드가 통과해버린다
  const okIdx = i => Number.isInteger(i) && i>=0 && i<WEEKS.length;
  if(!okIdx(ST.wkIdx))  ST.wkIdx = WEEKS.length-1;   // 비교주(뒤)
  if(!okIdx(ST.wkBase)) ST.wkBase = ST.wkIdx-1;      // 기준주(앞)
  if(ST.wkBase===ST.wkIdx) ST.wkBase = ST.wkIdx>0 ? ST.wkIdx-1 : ST.wkIdx+1;
  const cw=WEEKS[ST.wkIdx], pw=WEEKS[ST.wkBase];

  const rows=[];
  for(const g of D.groups){
    const pbC=sumRange(g.mine,cw.s,cw.e), pbP=sumRange(g.mine,pw.s,pw.e);
    const cpC=sumRangeMulti(g.comps,cw.s,cw.e), cpP=sumRangeMulti(g.comps,pw.s,pw.e);
    const pbR=relCh(pbC.gmv,pbP.gmv), cpR=relCh(cpC.gmv,cpP.gmv);
    const together = pbR!=null && cpR!=null && Math.sign(pbR)===Math.sign(cpR)
                     && Math.abs(cpR)>=0.03 && Math.abs(pbR)>=0.03;

    rows.push(`<tr class="grp"><td colspan="8" class="l">그룹 ${g.id}
      <span style="font-weight:400;color:var(--muted)"> · 경쟁 대비 매출 지수 ${idxPct(pbC.gmv,cpC.gmv)}</span></td></tr>`);

    const line=(pid,c,p,isPB,label)=>{
      const d=wkDriver(c,p);
      const drv = d ? `<b class="${d.top.v>0?'wd up':'wd down'}" style="display:inline;font-size:12px">${drvTxt(d.top)}</b>` : '<span style="color:var(--muted)">변화 미미</span>';
      const notes=[];
      if(d && d.opp) notes.push(`단 <b>${drvTxt(d.opp)}</b>가 상쇄`);
      if(isPB && together) notes.push('경쟁도 같은 방향 (시즌성 가능)');
      else if(isPB && pbR!=null && cpR!=null && Math.sign(pbR)!==Math.sign(cpR)) notes.push('경쟁과 반대 방향');
      if(c.orders<30 || p.orders<30) notes.push('표본 적음 (주문 30건 미만) — 증감률 해석 주의');
      const co = notes.map(n=>`<span class="co">${n}</span>`).join('');
      const can = pid!=null && D.wkOpts && D.wkOpts[pid];          // 합계행은 옵션 패널 없음
      const open = can && ST.wkOpen.has(String(pid));
      const caret = can ? `<span class="exp">${open?'▼':'▶'}</span>` : '<span class="exp"></span>';
      return `<tr class="${isPB?'pb':''} ${can?'clk':''} ${open?'open':''}" ${can?`data-pid="${pid}"`:''}>
        <td class="l who" title="${label.replace(/"/g,'&quot;')}">${caret}<span class="tag ${isPB?'pb':'cp'}">${isPB?'PB':'경쟁'}</span>${label}</td>
        ${wkCell(c.imp,p.imp,cnt)}
        ${wkCell(c.ctr,p.ctr,pct)}
        ${wkCell(c.clk,p.clk,cnt)}
        ${wkCell(c.cvr,p.cvr,pct)}
        ${wkCell(c.orders,p.orders,cnt)}
        ${wkCell(c.gmv,p.gmv,v=>'₩'+won(v),true)}
        <td class="wdrv l">${drv}${co}</td></tr>`
        + (open ? `<tr class="opt"><td colspan="8">${wkOptPanel(String(pid),cw,pw)}</td></tr>` : '');
    };
    rows.push(line(g.mine,pbC,pbP,true,nm(g.mine).short));
    if(g.comps.length>1){
      rows.push(line(null,cpC,cpP,false,`${g.comps.length}종 합계`));
      for(const cp of g.comps){
        rows.push(line(cp,sumRange(cp,cw.s,cw.e),sumRange(cp,pw.s,pw.e),false,'└ '+nm(cp).short));
      }
    } else {
      rows.push(line(g.comps[0],cpC,cpP,false,nm(g.comps[0]).short));
    }
  }

  el.innerHTML=`
    <div class="card">
      <div class="wkhead">
        <h2>주간 비교 · ${wkLabel(pw)} 주간 vs ${wkLabel(cw)} 주간</h2>
        <div class="wksub">월~일 완결주 기준(진행 중인 주 제외). 각 칸은 <b>기준주 → 비교주</b> 실적을 나란히 보여주고, 그 아래가 증감률입니다.
          <b>상품 행을 클릭</b>하면 그 주에 팔린 옵션 상위 10개가 펼쳐집니다.</div>
      </div>
      <div class="wkbar">
        <span class="ctl-label">기준주</span>
        <select id="wkBaseSel">${WEEKS.map((w,i)=>`<option value="${i}" ${i===ST.wkBase?'selected':''}>${wkLabel(w)}</option>`).join('')}</select>
        <span class="warr" style="font-size:14px">→</span>
        <span class="ctl-label">비교주</span>
        <select id="wkSel">${WEEKS.map((w,i)=>`<option value="${i}" ${i===ST.wkIdx?'selected':''}>${wkLabel(w)}</option>`).join('')}</select>
        <button id="wkPrev" class="wkbtn">◀ 한 주 앞으로</button>
        <button id="wkNext" class="wkbtn">한 주 뒤로 ▶</button>
        <span class="vs">퍼널 순서: 임프레션 → CTR → 유입 → CVR → 주문 → 매출</span>
      </div>
      <div class="wkwrap"><table class="wk">
        <thead><tr>
          <th class="l">상품</th><th>임프레션</th><th>CTR</th><th>유입(PDP)</th>
          <th>CVR</th><th>주문</th><th class="wsep">매출</th><th class="l">변화 주도 요인</th>
        </tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table></div>
      <div class="fnote">‘변화 주도 요인’은 <b>매출 = 임프레션 × CTR × CVR × 객단가</b> 항등식을 로그 분해해, 이번 주 매출 변화에 가장 크게 기여한 항목을 자동으로 고른 것입니다.
      임프레션이 주도 = 노출 자체가 늘거나 줄어든 것(랭킹·광고·스오딜), CTR이 주도 = 노출은 됐는데 클릭이 변한 것(썸네일·가격·리뷰), CVR이 주도 = 유입은 됐는데 구매가 변한 것(PDP·품절·가격).</div>
    </div>`;
  $('#wkSel').onchange     = e => { ST.wkIdx =+e.target.value; renderWeekly(); };
  $('#wkBaseSel').onchange = e => { ST.wkBase=+e.target.value; renderWeekly(); };
  // 두 주를 붙인 채로 같이 이동 (간격은 유지)
  const shift = n => {
    const gap = ST.wkIdx-ST.wkBase;
    const ni = ST.wkIdx+n, nb = ni-gap;
    if(ni<0||ni>=WEEKS.length||nb<0||nb>=WEEKS.length) return;
    ST.wkIdx=ni; ST.wkBase=nb; renderWeekly();
  };
  $('#wkPrev').onclick = ()=>shift(-1);
  $('#wkNext').onclick = ()=>shift(1);
  // 상품 행 클릭 → 그 주 옵션 상위10 펼치기/접기
  $('#viewWeekly').querySelectorAll('tr.clk').forEach(tr=>tr.onclick=()=>{
    const pid=tr.dataset.pid;
    if(ST.wkOpen.has(pid)) ST.wkOpen.delete(pid); else ST.wkOpen.add(pid);
    renderWeekly();
  });
}

function renderDetail(){
  const g=D.groups[ST.groupIdx]; const [start,end]=rangeDates(); const metric=ST.metric;
  const multiComp = g.comps.length>1;
  const el=$('#viewDetail');
  el.innerHTML=`
    <div class="detail-head">
      <div><h2>그룹 ${g.id} · ${nm(g.mine).short}</h2>
        <div class="vs"><b class="pb">PB</b> ${nm(g.mine).full} &nbsp;vs&nbsp; <b class="cp">경쟁</b> ${g.comps.map(compName).join(' + ')}</div></div>
      <select id="metricSel">
        <option value="gmv">매출</option><option value="imp">임프레션</option>
        <option value="ctr">CTR</option><option value="cvr">CVR</option>
        <option value="aov">AOV</option><option value="orders">주문수</option>
      </select>
    </div>
    <div class="totalbar" id="detailTotal"></div>
    <div class="detail-grid">
      <div>
        <div class="legend" id="trendLegend"></div>
        <div id="trendChart"></div>
        <div class="promobar" id="promoBar"></div>
        <label class="chk" id="splitWrap" style="margin-top:8px;display:${multiComp?'inline-flex':'none'}">
          <input type="checkbox" id="splitChk" ${ST.split?'checked':''}> 경쟁 상품 개별로 보기 (합산 해제)
        </label>
        <div class="tiles" id="tiles"></div>
      </div>
      <div>
        <div class="panel-title"><h3>옵션별 매출</h3><select id="optWho"></select></div>
        <div id="optTable"></div>
      </div>
    </div>
    <div class="catsec">
      <div class="panel-title"><h3>카테고리 대비</h3><span class="catshare" id="catShare"></span></div>
    </div>
    <div class="funnel" id="funnelSec"></div>
    <div class="note" id="promoNote"><b>프로모션·이벤트 오버레이</b> — 스오딜/쿠폰/행사 일정을 <code>promos.js</code>에 추가하면 위 추이 차트에 <span style="color:#e87ba4">스오딜</span>·<span style="color:#4a3aa7">쿠폰</span>·<span style="color:#1baf7a">행사</span> 구간이 표시됩니다. (그룹 A:러그 B:수건 C:커튼 D:욕실화 E:발매트)</div>
    ${g.note?`<div class="note warn">⚠️ ${g.note}</div>`:''}`;

  $('#metricSel').value=metric;
  $('#metricSel').onchange=e=>{ST.metric=e.target.value;renderDetail();};
  const sp=$('#splitChk'); if(sp) sp.onchange=e=>{ST.split=e.target.checked;renderDetail();};

  // trend lines
  const mineS=series([g.mine],start,end,ST.gran);
  const lines=[{name:'PB · '+nm(g.mine).short,color:'var(--pb)',pts:mineS.map(b=>({label:b.label,v:b[metric]}))}];
  if(multiComp && ST.split){
    const cols=['var(--comp)','var(--comp2)'];
    g.comps.forEach((c,i)=>{const s=series([c],start,end,ST.gran);
      lines.push({name:compName(c),color:cols[i%2],pts:s.map(b=>({label:b.label,v:b[metric]})),dash:true});});
  }else{
    const cs=series(g.comps,start,end,ST.gran);
    lines.push({name:multiComp?'경쟁 합산':compName(g.comps[0]),color:'var(--comp)',pts:cs.map(b=>({label:b.label,v:b[metric]})),dash:true});
  }
  // category total on secondary (right) axis — only for 매출 (scale differs by ~100x)
  const catCols=['#1baf7a','#4a3aa7'];
  const catIds=[...new Set([g.mine,...g.comps].map(p=>String(D.productCat[p])).filter(c=>c&&c!=='undefined'))];
  if(metric==='gmv'){
    catIds.forEach((cid,i)=>{
      const cs=catSeries(cid,start,end,ST.gran);
      lines.push({name:'카테고리 '+(D.category[cid]||cid), color:catCols[i%catCols.length], axis:'right', pts:cs.map(b=>({label:b.label,v:b.gmv}))});
    });
  }
  $('#trendLegend').innerHTML = lines.map(l=>
      `<span><span class="swatch" style="background:${l.color}"></span>${l.name}${l.axis==='right'?' <span style="color:var(--muted)">(우측축)</span>':''}</span>`).join('')
    + (metric!=='gmv'?` <span style="color:var(--muted);font-size:11px">· 카테고리(우측축)는 '매출'에서 표시</span>`:'');

  // promo overlay: match entries to this group, map to bucket indices within view range
  const pidSet=[g.mine,...g.comps];
  const applies = p => (p.group && String(p.group).toUpperCase()===g.id) || (p.pid && pidSet.includes(+p.pid)) || String(p.group).toLowerCase()==='all';
  const buckets = mineS.map(b=>({span:spanOf(b.key,ST.gran)}));
  const bands=[];
  for(const p of (window.PROMOS||[])){
    if(!applies(p) || !p.start || !p.end) continue;
    const idxs=[]; buckets.forEach((bk,i)=>{ if(p.start<=bk.span[1] && p.end>=bk.span[0]) idxs.push(i); });
    if(!idxs.length) continue;
    bands.push({i0:idxs[0], i1:idxs[idxs.length-1], point:(p.start===p.end && idxs.length===1),
      color:PROMO_COLORS[p.type]||'#888', type:p.type, label:p.label||'', start:p.start, end:p.end});
  }
  lineChart($('#trendChart'), lines, metric, bands);
  $('#promoBar').innerHTML = bands.length
    ? bands.map(b=>`<span class="pchip"><span class="dot" style="background:${b.color}"></span>${b.type}${b.label?' · '+b.label:''} <span class="pd">${b.start===b.end?b.start.slice(5):b.start.slice(5)+'~'+b.end.slice(5)}</span></span>`).join('')
    : `<span style="font-size:11px;color:var(--muted)">표시 구간 내 등록된 프로모션 없음</span>`;

  // tiles — PB vs 경쟁
  const mine=sumRange(g.mine,start,end), comp=sumRangeMulti(g.comps,start,end);
  // period-total 매출 strip (이 그룹 기준)
  const [ps,pe]=prevDates(start,end); const prevOK=ps>=D.dateRange.start;
  const minePrev=sumRange(g.mine,ps,pe);
  $('#detailTotal').innerHTML=totalStripHTML(mine,comp,minePrev.gmv,prevOK,start,end,
    {mine:`PB · ${nm(g.mine).short}`, comp:`경쟁${multiComp?' 합산':''}`});
  const days=Math.max(1,Math.round((parse(end)-parse(start))/86400000)+1);
  const perDay=s=>s.orders/days;
  const tiles=[
    ['임프레션', mine.imp, comp.imp, num],
    ['CTR', mine.ctr, comp.ctr, pct],
    ['CVR', mine.cvr, comp.cvr, pct],
    ['AOV', mine.aov, comp.aov, wonUnit],
    ['평균 구매건수', perDay(mine), perDay(comp), v=>v.toFixed(1)+'건/일'],
  ];
  $('#tiles').innerHTML = tiles.map(([lb,pb,cp,f])=>`
    <div class="tile"><div class="t">${lb} · 경쟁 대비 지수</div>
      <div class="v tnum">${idxPct(pb,cp)}</div>
      <div class="c tnum">PB ${f(pb)} · 경쟁 ${f(cp)}</div>
    </div>`).join('');

  // option table
  const sel=$('#optWho');
  sel.innerHTML=[`<option value="${g.mine}">${nm(g.mine).short}</option>`,
    ...g.comps.map(pid=>`<option value="${pid}">${compName(pid)}</option>`)].join('');
  sel.value=g.mine; sel.onchange=renderOptTable;
  renderOptTable();

  // category share (PB within its leaf category) — category trend itself is on the chart's right axis
  const pbCat=String(D.productCat[g.mine]); const catTot=catSum(pbCat,start,end);
  const pbShare=catTot?mine.gmv/catTot:0;
  let share=`<b>${D.category[pbCat]}</b> 내 PB 점유율 <b>${(pbShare*100).toFixed(1)}%</b>`;
  if(catIds.length===1){ const grp=catTot?(mine.gmv+comp.gmv)/catTot:0; share+=` · PB+경쟁 <b>${(grp*100).toFixed(1)}%</b>`; }
  else { share+=` <span style="color:var(--muted)">(경쟁은 다른 카테고리)</span>`; }
  $('#catShare').innerHTML=share;

  // ── 유입 퍼널 (면별 노출·CTR) ──
  const B=D.funnelBuckets||[];
  if(B.length){
    const fPB=funnelAgg([g.mine],start,end), fCP=funnelAgg(g.comps,start,end);
    const tPB=B.reduce((a,b)=>a+fPB[b.k].imp,0), tCP=B.reduce((a,b)=>a+fCP[b.k].imp,0);
    const bar=(agg,tot)=>B.map(b=>{const w=tot?agg[b.k].imp/tot*100:0;
      return w>0.3?`<div class="seg" style="width:${w}%;background:${b.color}" title="${b.label} ${w.toFixed(1)}%"></div>`:'';}).join('');
    const legend=B.map(b=>`<span><span class="swatch" style="background:${b.color}"></span>${b.label}</span>`).join('');
    const rows=B.map(b=>{
      const pb=fPB[b.k], cp=fCP[b.k];
      const pbSh=tPB?pb.imp/tPB*100:0, cpSh=tCP?cp.imp/tCP*100:0;
      const pbC=pb.imp?pb.clk/pb.imp*100:0, cpC=cp.imp?cp.clk/cp.imp*100:0;
      const gap=(b.k==='deal'||b.k==='exhibit')&&pbSh-cpSh>=3;   // highlight PB-heavy diluters
      return `<tr${gap?' style="background:rgba(235,104,52,0.08)"':''}>
        <td><span class="swatch" style="background:${b.color}"></span>${b.label}</td>
        <td class="tnum">${manNum(pb.imp)}</td><td class="tnum">${pbSh.toFixed(0)}%</td><td class="tnum">${pbC.toFixed(2)}%</td>
        <td class="tnum">${manNum(cp.imp)}</td><td class="tnum">${cpSh.toFixed(0)}%</td><td class="tnum">${cpC.toFixed(2)}%</td></tr>`;
    }).join('');
    $('#funnelSec').innerHTML=`
      <div class="panel-title"><h3>유입 퍼널 · 면별 노출·CTR</h3></div>
      <div class="legend" style="margin-bottom:8px">${legend}</div>
      <div class="frow"><span class="who">PB</span><div class="fbar">${bar(fPB,tPB)}</div></div>
      <div class="frow"><span class="who">경쟁</span><div class="fbar">${bar(fCP,tCP)}</div></div>
      <table style="margin-top:12px"><thead><tr><th>유입 면</th><th>PB 노출</th><th>비중</th><th>CTR</th><th>경쟁 노출</th><th>비중</th><th>CTR</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="fnote">막대 = 노출 구성비(면 믹스) · 월 단위 집계(선택 기간이 걸친 월 기준). CTR = 전체클릭÷노출(면별 파이프라인) — 상단 메인 CTR은 PDP뷰 기준이라 절대값은 다릅니다. 주황/빨강(오늘의딜·기획전)은 저의도 노출로 CTR을 희석합니다.</div>`;
  }
}
function renderOptTable(){
  const pid=$('#optWho').value; const all=D.options[pid]||[]; const list=all.slice(0,15);
  const tot=all.reduce((a,o)=>a+o.gmv,0); const max=list.length?list[0].gmv:1;
  $('#optTable').innerHTML = `
    <div style="font-size:11.5px;color:var(--muted);margin-bottom:6px">기간 전체 합산 · 상위 15개 (총 옵션 ${all.length}개)</div>
    <table><thead><tr><th>옵션</th><th>매출</th><th>비중</th><th>수량</th></tr></thead><tbody>
    ${list.map(o=>`<tr>
      <td style="max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${o.name.replace(/"/g,'&quot;')}">${o.name}</td>
      <td class="tnum">₩${won(o.gmv)}<div class="bar" style="width:${Math.max(4,o.gmv/max*100)}%"></div></td>
      <td class="tnum">${tot?(o.gmv/tot*100).toFixed(1):0}%</td>
      <td class="tnum">${num(o.qty)}</td></tr>`).join('')}
    </tbody></table>`;
}

function renderMeta(){
  const [start,end]=rangeDates();
  $('#hdrSub').textContent = `데이터 ${D.dateRange.start} ~ ${D.dateRange.end} · 생성 ${D.generatedAt}`;
  $('#rangeNote').textContent = `표시 구간: ${start} ~ ${end}`;
  $('#foot').innerHTML = `소스: <b>ba_preserved.comm_product_perform</b> (매출·임프·클릭·주문) · <b>da_datahub.df_com_sales</b> (옵션별 매출) · `+
    `CTR=클릭÷임프, CVR=주문÷클릭, AOV=매출÷주문, 경쟁 대비 지수=PB÷경쟁. GMV는 순거래액(취소반영), 임프·클릭은 상품 단위.`;
}

function renderAll(){
  renderNav(); renderControls(); renderMeta();
  const summary = ST.view==='summary', weekly = ST.view==='weekly';
  $('#viewSummary').style.display = summary?'block':'none';
  $('#viewWeekly').style.display  = weekly?'block':'none';
  $('#viewDetail').style.display  = (summary||weekly)?'none':'block';
  // 주간 비교는 자체 주차 선택기를 쓰므로 상단 기간 컨트롤은 숨긴다
  $('.controls').style.display = weekly?'none':'flex';
  if(summary){ renderTotal(); renderKPI(); renderCatOverview(); }
  else if(weekly){ renderWeekly(); }
  else renderDetail();
}
renderAll();
</script>
</body>
</html>
