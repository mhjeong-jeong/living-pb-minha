<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매출 추이 대시보드 · PB vs 경쟁</title>
<style>
:root{
  color-scheme: light dark;
  --plane:#f9f9f7; --surface:#fcfcfb; --surface2:#f4f3f0;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --pb:#2a78d6; --comp:#eb6834; --comp2:#eda100;
  --good:#006300; --bad:#d03b3b; --chip:#eef0ee;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --plane:#0d0d0d; --surface:#1a1a19; --surface2:#242422;
    --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --pb:#3987e5; --comp:#d95926; --comp2:#c98500;
    --good:#0ca30c; --bad:#e66767; --chip:#242422;
  }
}
:root[data-theme="light"]{
  --plane:#f9f9f7; --surface:#fcfcfb; --surface2:#f4f3f0;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --pb:#2a78d6; --comp:#eb6834; --comp2:#eda100;
  --good:#006300; --bad:#d03b3b; --chip:#eef0ee;
}
:root[data-theme="dark"]{
  --plane:#0d0d0d; --surface:#1a1a19; --surface2:#242422;
  --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --pb:#3987e5; --comp:#d95926; --comp2:#c98500;
  --good:#0ca30c; --bad:#e66767; --chip:#242422;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3{margin:0;font-weight:650}
.wrap{max-width:1240px;margin:0 auto;padding:20px 20px 80px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin-bottom:12px}
header h1{font-size:20px}
.sub{color:var(--muted);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.tnum{font-variant-numeric:tabular-nums}

/* nav */
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.nav button{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink2);
  padding:8px 15px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px}
.nav button.on{background:var(--pb);border-color:var(--pb);color:#fff;font-weight:600}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 18px;
  padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.ctl-label{font-size:12px;color:var(--muted);margin-right:2px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink2);padding:6px 12px;
  font-size:13px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--pb);color:#fff;font-weight:600}
input[type=date]{font-family:inherit;font-size:12.5px;padding:5px 8px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);color-scheme:light dark}
select{font-family:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink)}
.range-note{font-size:12px;color:var(--muted)}

/* KPI grid */
.kpigrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.kpigrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.kpigrid{grid-template-columns:1fr}}
.kpi{cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:var(--pb)}
.kpi .g{font-size:11px;color:var(--muted);letter-spacing:.03em}
.kpi .pair{font-size:12.5px;margin:2px 0 10px}
.kpi .pair b{font-weight:600}
.kpi .lbl{font-size:11px;color:var(--muted)}
.kpi .big{font-size:22px;font-weight:680;letter-spacing:-.01em}
.kpi .idxrow{display:flex;align-items:baseline;gap:8px;margin-top:3px}
.idx{font-size:12.5px;font-weight:650}
.delta{font-size:12px;font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}
.kpi .mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(46px,1fr));gap:6px 8px;margin-top:11px;
  border-top:1px solid var(--border);padding-top:9px}
.kpi .mini div{font-size:11px;color:var(--muted);text-align:center}
.kpi .mini b{display:block;color:var(--ink);font-size:12.5px;font-weight:600;margin-top:1px}

/* detail */
.detail-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}
.detail-head h2{font-size:17px}
.detail-head .vs{font-size:12.5px;color:var(--muted)}
.detail-head .vs b.pb{color:var(--pb)} .detail-head .vs b.cp{color:var(--comp)}
.detail-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
@media(max-width:920px){.detail-grid{grid-template-columns:1fr}}
.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.panel-title h3{font-size:14px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surface2);border-radius:10px;padding:11px 12px}
.tile .t{font-size:11px;color:var(--muted)}
.tile .v{font-size:17px;font-weight:660;margin-top:2px}
.tile .c{font-size:11.5px;color:var(--ink2);margin-top:2px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:11px}
tbody tr:hover{background:var(--surface2)}
.bar{height:5px;border-radius:3px;background:var(--pb);margin-top:3px}

.tt{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);
  padding:7px 9px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .08s;z-index:20;
  box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap}
.tt b{color:#fff}
.note{font-size:12px;color:var(--muted);background:var(--surface2);border:1px dashed var(--border);
  border-radius:10px;padding:12px 14px;margin-top:14px}
.warn{border-color:var(--comp);color:var(--ink2)}
.foot{margin-top:26px;color:var(--muted);font-size:11.5px}
svg{display:block;width:100%;height:auto;overflow:visible}
.chk{font-size:12px;color:var(--ink2);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.catov{margin-top:20px}
.catov h3{font-size:14px;margin:0 0 4px}
.catov .csub{font-size:12px;color:var(--muted);margin-bottom:12px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.catcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.cctitle{font-size:12.5px;font-weight:600;margin-bottom:2px}
.cctitle .amt{float:right;color:var(--ink2);font-weight:600}
.ccsub{font-size:11px;color:var(--muted);margin-bottom:6px}
.catsec{margin-top:18px;border-top:1px solid var(--border);padding-top:14px}
.funnel{margin-top:18px;border-top:1px solid var(--border);padding-top:14px}
.fbar{display:flex;height:20px;border-radius:5px;overflow:hidden;border:1px solid var(--border);background:var(--surface2)}
.fbar .seg{height:100%}
.frow{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:10px;margin:5px 0}
.frow .who{font-size:11.5px;color:var(--ink2);font-weight:600}
.fnote{font-size:11px;color:var(--muted);margin-top:8px}
.catshare{font-size:12px;color:var(--ink2)}
.catshare b{color:var(--ink);font-weight:650}
.promobar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:4px}
.pchip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);
  display:inline-flex;align-items:center;gap:5px}
.pchip .dot{width:8px;height:8px;border-radius:50%}
.pchip .pd{color:var(--muted)}
</style>
</head>

<script>
const D = window.DASH;
const $ = s => document.querySelector(s);
const tip = $('#tooltip');

/* ---------- formatting ---------- */
const won = v => {
  v = Math.round(v||0);
  if (Math.abs(v) >= 1e8) return (v/1e8).toFixed(v>=1e9?0:1)+'억';
  if (Math.abs(v) >= 1e4) return Math.round(v/1e4).toLocaleString()+'만';
  return v.toLocaleString();
};
const wonUnit = v => Math.round(v||0).toLocaleString()+'원';   // AOV: 원 단위
const plain   = v => Math.round(v||0).toLocaleString();
const num = v => Math.round(v||0).toLocaleString();
const pct = v => (v==null||!isFinite(v)) ? '–' : (v*100).toFixed(2)+'%';
const idxPct = (a,b) => (!b) ? '–' : Math.round(a/b*100)+'%';

/* ---------- date utils ---------- */
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const iso = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const addDays=(dt,n)=>{const x=new Date(dt);x.setDate(x.getDate()+n);return x;};
const mondayOf=dt=>{const x=new Date(dt);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x;};
const DMIN=parse(D.dateRange.start), DMAX=parse(D.dateRange.end);

/* ---------- data access ---------- */
const dailyOf = pid => D.daily[pid] || [];
const nm = pid => D.names[pid] || {short:String(pid),full:String(pid)};
const compName = pid => nm(pid).short + ' (' + pid + ')';   // 경쟁 상품은 상품코드 병기

function sumRange(pid,start,end){
  let g=0,o=0,q=0,i=0,c=0;
  for(const r of dailyOf(pid)){
    if(r.dt>=start && r.dt<=end){g+=r.gmv;o+=r.orders;q+=r.qty;i+=r.imp;c+=r.clk;}
  }
  return {gmv:g,orders:o,qty:q,imp:i,clk:c,ctr:i?c/i:0,cvr:c?o/c:0,aov:o?g/o:0};
}
function sumRangeMulti(pids,start,end){
  const t={gmv:0,orders:0,qty:0,imp:0,clk:0};
  for(const p of pids){const s=sumRange(p,start,end);t.gmv+=s.gmv;t.orders+=s.orders;t.qty+=s.qty;t.imp+=s.imp;t.clk+=s.clk;}
  t.ctr=t.imp?t.clk/t.imp:0; t.cvr=t.clk?t.orders/t.clk:0; t.aov=t.orders?t.gmv/t.orders:0;
  return t;
}
function series(pids,start,end,gran){
  const map=new Map();
  const keyFn = gran==='day' ? (dt=>iso(dt))
    : gran==='week' ? (dt=>iso(mondayOf(dt)))
    : (dt=>iso(dt).slice(0,7));
  for(const p of pids){
    for(const r of dailyOf(p)){
      if(r.dt<start||r.dt>end) continue;
      const k=keyFn(parse(r.dt));
      let b=map.get(k); if(!b){b={key:k,gmv:0,orders:0,qty:0,imp:0,clk:0};map.set(k,b);}
      b.gmv+=r.gmv;b.orders+=r.orders;b.qty+=r.qty;b.imp+=r.imp;b.clk+=r.clk;
    }
  }
  const arr=[...map.values()].sort((a,b)=>a.key<b.key?-1:1);
  for(const b of arr){b.ctr=b.imp?b.clk/b.imp:0;b.cvr=b.clk?b.orders/b.clk:0;b.aov=b.orders?b.gmv/b.orders:0;
    b.label = gran==='week' ? b.key.slice(5).replace('-','/')+' 주'
            : gran==='month' ? b.key.slice(0,7)
            : b.key.slice(5).replace('-','/');}
  return arr;
}

const RANGES = [
  {k:'w1',  label:'최근 1주',  days:7,   gran:'day'},
  {k:'w4',  label:'최근 4주',  days:28,  gran:'day'},
  {k:'w12', label:'최근 12주', days:84,  gran:'week'},

  {k:'all', label:'전체',      all:true, gran:'week'},
];
const METRICS = {
  gmv:{label:'매출',fmt:won,ffmt:v=>'₩'+Math.round(v).toLocaleString()},
  imp:{label:'임프레션',fmt:num,ffmt:num},
  ctr:{label:'CTR',fmt:pct,ffmt:pct},
  cvr:{label:'CVR',fmt:pct,ffmt:pct},
  aov:{label:'AOV',fmt:plain,ffmt:wonUnit},   // 원 단위
  orders:{label:'주문수',fmt:num,ffmt:num},
  idx:{label:'지수',fmt:v=>Math.round(v),ffmt:v=>Math.round(v)+' (시작=100)'},
};
const PROMO_COLORS = {'스오딜':'#e87ba4', '쿠폰':'#4a3aa7', '행사':'#1baf7a'};
function spanOf(key,gran){
  if(gran==='day') return [key,key];
  if(gran==='week'){ return [key, iso(addDays(parse(key),6))]; }
  return [key+'-01', key+'-31'];   // month bucket
}
// category daily GMV → bucketed series / period sum
function catSeries(cid,start,end,gran){
  const keyFn = gran==='day'?(dt=>iso(dt)):gran==='week'?(dt=>iso(mondayOf(dt))):(dt=>iso(dt).slice(0,7));
  const map=new Map();
  for(const r of (D.catDaily[cid]||[])){
    if(r.dt<start||r.dt>end) continue;
    const k=keyFn(parse(r.dt)); let b=map.get(k); if(!b){b={key:k,gmv:0};map.set(k,b);} b.gmv+=r.gmv;
  }
  const arr=[...map.values()].sort((a,b)=>a.key<b.key?-1:1);
  for(const b of arr) b.label = gran==='week'?b.key.slice(5).replace('-','/')+' 주':gran==='month'?b.key.slice(0,7):b.key.slice(5).replace('-','/');
  return arr;
}
function catSum(cid,start,end){ let g=0; for(const r of (D.catDaily[cid]||[])) if(r.dt>=start&&r.dt<=end) g+=r.gmv; return g; }
// funnel: sum impressions/clicks by surface bucket over the months overlapping [start,end]
function funnelAgg(pids,start,end){
  const m0=start.slice(0,7), m1=end.slice(0,7);
  const agg={}; (D.funnelBuckets||[]).forEach(b=>agg[b.k]={imp:0,clk:0});
  for(const p of pids){ for(const r of (D.funnel[String(p)]||[])){
    if(r.ym<m0||r.ym>m1) continue; if(!agg[r.b]) agg[r.b]={imp:0,clk:0};
    agg[r.b].imp+=r.imp; agg[r.b].clk+=r.clk; } }
  return agg;
}

function rangeDates(){

  }
  const r=RANGES.find(x=>x.k===ST.rangeKey);
  if(r.all) return [D.dateRange.start, D.dateRange.end];
  if(r.mtd){ const s=new Date(DMAX.getFullYear(),DMAX.getMonth(),1); return [iso(s), D.dateRange.end]; }
  const s=addDays(DMAX, -(r.days-1)); const sc = s<DMIN?DMIN:s;
  return [iso(sc), D.dateRange.end];
}
function prevDates(start,end){
  const s=parse(start),e=parse(end); const len=Math.round((e-s)/86400000)+1;
  return [iso(addDays(s,-len)), iso(addDays(s,-1))];
}

/* ---------- SVG line chart ---------- */
const RIGHT_AXIS_COLOR = '#1baf7a';
function lineChart(el, lines, metric, bands){
  const rightLines = lines.filter(l=>l.axis==='right');
  const hasRight = rightLines.length>0;
  const leftLines = lines.filter(l=>l.axis!=='right');
  const W=680,H=280,PAD={l:58,r:hasRight?62:16,t:14,b:34};
  const iw=W-PAD.l-PAD.r, ih=H-PAD.t-PAD.b;
  const n = lines[0]?lines[0].pts.length:0;
  const half = n>1 ? iw/(n-1)/2 : iw/2;
  function scale(arr){
    let mx=Math.max(...arr,0), rmin=Math.min(...arr,0);
    let mn = rmin>=0 ? 0 : rmin;
    if(mx===mn) mx=mn+1;
    const p=(mx-mn)*0.08; mx+=p; if(mn<0) mn-=p;
    return {mn,mx};
  }
  const L = scale((leftLines.length?leftLines:lines).flatMap(l=>l.pts.map(p=>p.v)));
  const R = hasRight ? scale(rightLines.flatMap(l=>l.pts.map(p=>p.v))) : null;
  const X=i=> n<=1?PAD.l+iw/2 : PAD.l + iw*i/(n-1);
  const YL=v=> PAD.t + ih*(1-(v-L.mn)/(L.mx-L.mn));
  const YR=v=> PAD.t + ih*(1-(v-R.mn)/(R.mx-R.mn));
  const Yof=l=> l.axis==='right'?YR:YL;
  const lfmt = METRICS[metric].fmt;
  const lffmt = METRICS[metric].ffmt;
  const rffmt = v=>'₩'+Math.round(v||0).toLocaleString();
  const fmtOf=l=> l.axis==='right'?rffmt:lffmt;
  // promo overlay bands (behind grid/lines)
  let bandSvg='';
  for(const bd of (bands||[])){
    if(bd.point){
      const x=X(bd.i0);
      bandSvg+=`<line x1="${x}" x2="${x}" y1="${PAD.t}" y2="${PAD.t+ih}" stroke="${bd.color}" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>`;
      bandSvg+=`<circle cx="${x}" cy="${PAD.t}" r="3.5" fill="${bd.color}"/>`;
    }else{
      const x0=X(bd.i0)-half, x1=X(bd.i1)+half;
      bandSvg+=`<rect x="${x0.toFixed(1)}" y="${PAD.t}" width="${Math.max(2,x1-x0).toFixed(1)}" height="${ih}" fill="${bd.color}" opacity="0.13"/>`;
      bandSvg+=`<rect x="${x0.toFixed(1)}" y="${PAD.t}" width="2" height="${ih}" fill="${bd.color}" opacity="0.55"/>`;
    }
  }
  let grid='';
  for(let g=0;g<=4;g++){const y=PAD.t+ih*(1-g/4);
    grid+=`<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    grid+=`<text x="${PAD.l-8}" y="${y+3.5}" text-anchor="end" fill="var(--muted)" font-size="10.5" class="tnum">${lfmt(L.mn+(L.mx-L.mn)*g/4)}</text>`;
    if(hasRight) grid+=`<text x="${W-PAD.r+7}" y="${y+3.5}" text-anchor="start" fill="${RIGHT_AXIS_COLOR}" font-size="10.5" class="tnum">${won(R.mn+(R.mx-R.mn)*g/4)}</text>`;}
  const step=Math.ceil(n/8); let xlab='';
  for(let i=0;i<n;i++){ if(i%step && i!==n-1) continue;
    xlab+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle" fill="var(--muted)" font-size="10.5" class="tnum">${lines[0].pts[i].label}</text>`;}
  let paths='';
  for(const l of lines){
    const yf=Yof(l);
    const d=l.pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+yf(p.v).toFixed(1)).join(' ');
    paths+=`<path d="${d}" fill="none" stroke="${l.color}" stroke-width="2" ${l.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round"/>`;
    if(n<=1) paths+=`<circle cx="${X(0)}" cy="${yf(l.pts[0].v)}" r="4" fill="${l.color}"/>`;
  }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img">
    ${bandSvg}${grid}${xlab}${paths}
    <line id="cross" x1="0" x2="0" y1="${PAD.t}" y2="${PAD.t+ih}" stroke="var(--axis)" stroke-width="1" opacity="0"/>
    <g id="dots"></g>
    <rect id="hit" x="${PAD.l}" y="${PAD.t}" width="${iw}" height="${ih}" fill="transparent"/>
  </svg>`;
  const svgEl=el.querySelector('svg'), cross=el.querySelector('#cross'), dots=el.querySelector('#dots'), hit=el.querySelector('#hit');
  function move(ev){
    const r=svgEl.getBoundingClientRect();
    const sx=(ev.clientX-r.left)/r.width*W;
    let i=Math.round((sx-PAD.l)/(iw/Math.max(n-1,1)));
    i=Math.max(0,Math.min(n-1,i));
    cross.setAttribute('x1',X(i));cross.setAttribute('x2',X(i));cross.setAttribute('opacity','1');
    dots.innerHTML=lines.map(l=>`<circle cx="${X(i)}" cy="${Yof(l)(l.pts[i].v)}" r="4" fill="${l.color}" stroke="var(--surface)" stroke-width="2"/>`).join('');
    let html=`<div>${lines[0].pts[i].label}</div>`;
    for(const l of lines) html+=`<div><span style="color:${l.color}">●</span> ${l.name}: <b>${fmtOf(l)(l.pts[i].v)}</b></div>`;
    tip.innerHTML=html; tip.style.opacity=1;
    tip.style.left=Math.min(ev.clientX+14, window.innerWidth-tip.offsetWidth-10)+'px';
    tip.style.top=(ev.clientY-10)+'px';
  }
  hit.addEventListener('mousemove',move);
  hit.addEventListener('mouseleave',()=>{tip.style.opacity=0;cross.setAttribute('opacity','0');dots.innerHTML='';});
}

function renderKPI(){
  const [start,end]=rangeDates(); const [ps,pe]=prevDates(start,end);
  const prevOK = ps >= D.dateRange.start;
  $('#kpigrid').innerHTML = D.groups.map((g,gi)=>{
    const mine=sumRange(g.mine,start,end), comp=sumRangeMulti(g.comps,start,end);
    const minePrev=sumRange(g.mine,ps,pe);
    const dl = (prevOK && minePrev.gmv)? (mine.gmv-minePrev.gmv)/minePrev.gmv : null;
    const dCls = dl==null?'':dl>=0?'up':'down';
    const dTxt = dl==null?'–':(dl>=0?'▲':'▼')+' '+Math.abs(dl*100).toFixed(0)+'%';
    const mini = [['임프','imp'],['구매건수','orders'],['CTR','ctr'],['CVR','cvr'],['AOV','aov']].map(([lb,mk])=>
      `<div>${lb} 지수<b class="tnum">${idxPct(mine[mk],comp[mk])}</b></div>`).join('');
    return `<div class="kpi card" data-gi="${gi}">
      <div class="g">그룹 ${g.id}</div>
      <div class="pair"><b style="color:var(--pb)">${nm(g.mine).short}</b> <span style="color:var(--muted)">vs</span> <b style="color:var(--comp)">${g.comps.map(compName).join(' + ')}</b></div>

  $('#kpigrid').querySelectorAll('.kpi').forEach(k=>k.onclick=()=>{ST.view=+k.dataset.gi;ST.groupIdx=+k.dataset.gi;renderAll();});
}

    $('#funnelSec').innerHTML=`

      <div class="frow"><span class="who">경쟁</span><div class="fbar">${bar(fCP,tCP)}</div></div>
      <table style="margin-top:12px"><thead><tr><th>유입 면</th><th>PB 노출</th><th>비중</th><th>CTR</th><th>경쟁 노출</th><th>비중</th><th>CTR</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="fnote">막대 = 노출 구성비(면 믹스) · 월 단위 집계(선택 기간이 걸친 월 기준). CTR = 전체클릭÷노출(면별 파이프라인) — 상단 메인 CTR은 PDP뷰 기준이라 절대값은 다릅니다. 주황/빨강(오늘의딜·기획전)은 저의도 노출로 CTR을 희석합니다.</div>`;
  }
}

  const tot=all.reduce((a,o)=>a+o.gmv,0); const max=list.length?list[0].gmv:1;
  $('#optTable').innerHTML = `
    <div style="font-size:11.5px;color:var(--muted);margin-bottom:6px">기간 전체 합산 · 상위 15개 (총 옵션 ${all.length}개)</div>
    <table><thead><tr><th>옵션</th><th>매출</th><th>비중</th><th>수량</th></tr></thead><tbody>
    ${list.map(o=>`<tr>
      <td style="max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${o.name.replace(/"/g,'&quot;')}">${o.name}</td>
      <td class="tnum">₩${won(o.gmv)}<div class="bar" style="width:${Math.max(4,o.gmv/max*100)}%"></div></td>
      <td class="tnum">${tot?(o.gmv/tot*100).toFixed(1):0}%</td>
      <td class="tnum">${num(o.qty)}</td></tr>`).join('')}
    </tbody></table>`;
}

function renderMeta(){
  const [start,end]=rangeDates();
  $('#hdrSub').textContent = `데이터 ${D.dateRange.start} ~ ${D.dateRange.end} · 생성 ${D.generatedAt}`;
  $('#rangeNote').textContent = `표시 구간: ${start} ~ ${end}`;
  $('#foot').innerHTML = `소스: <b>ba_preserved.comm_product_perform</b> (매출·임프·클릭·주문) · <b>da_datahub.df_com_sales</b> (옵션별 매출) · `+
    `CTR=클릭÷임프, CVR=주문÷클릭, AOV=매출÷주문, 경쟁 대비 지수=PB÷경쟁. GMV는 순거래액(취소반영), 임프·클릭은 상품 단위.`;
}

function renderAll(){
  renderNav(); renderControls(); renderMeta();
  const summary = ST.view==='summary';
  $('#viewSummary').style.display = summary?'block':'none';
  $('#viewDetail').style.display  = summary?'none':'block';
  if(summary){ renderKPI(); renderCatOverview(); } else renderDetail();
}
renderAll();
</script>
</body>
</html>
